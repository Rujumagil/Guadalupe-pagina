<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>Recuperar acceso | Academia Nicté Ha</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#223f3b;background:#f9f8f5}
*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:7vh auto;padding:18px}
.card{background:#fff;padding:clamp(22px,5vw,42px);border:1px solid #e4e7e1;border-radius:22px;box-shadow:0 8px 32px #12352e09}
.kicker{color:#658c7e;font-size:12px;font-weight:700;letter-spacing:.16em}
h1{font-size:clamp(28px,5vw,38px);margin:12px 0;color:#234b43}p{color:#61716b;line-height:1.55}
label{display:block;font-size:14px;font-weight:650;margin-top:18px}
input{display:block;width:100%;padding:13px;margin-top:6px;border:1px solid #b6c9c2;border-radius:10px;font:inherit}
button{font:inherit;background:#276254;color:white;border:none;border-radius:10px;font-weight:650;padding:13px 18px;margin-top:18px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
a{color:#245a50}#message{white-space:pre-wrap;padding:12px 14px;background:#eef4f1;border-radius:10px;color:#24554b;margin-top:20px;min-height:44px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main><section class="card">
<span class="kicker">ACADEMIA NICTÉ HA · GUADALUPE GÓMEZ PEZUELA</span>
<h1>Recuperar mi acceso</h1>
<p id="description">Recibe un enlace privado en tu correo electrónico para establecer una nueva contraseña de tu cuenta académica.</p>
<form id="emailForm">
<label>Correo electrónico<input id="email" type="email" autocomplete="email" maxlength="254" required placeholder="tu@correo.com"></label>
<button id="send" type="submit">Enviar enlace de recuperación</button>
</form>
<form id="passwordForm" hidden>
<label>Nueva contraseña<input id="password" type="password" minlength="12" autocomplete="new-password" required></label>
<label>Confirmar contraseña<input id="confirm" type="password" minlength="12" autocomplete="new-password" required></label>
<button id="change" type="submit">Guardar nueva contraseña</button>
</form>
<p id="message" role="status" aria-live="polite">Tu información se gestiona de manera privada.</p>
<p><a href="./video-admin-prueba">Volver al acceso administrativo de videos</a></p>
</section></main>
<script src="./recuperar-videos.js" defer></script>
</body>
</html>
