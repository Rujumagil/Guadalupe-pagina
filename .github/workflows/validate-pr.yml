name: Validar cambios de la web

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar TypeScript
        run: npm run typecheck
      - name: Revisar lint
        run: npm run lint
      - name: Validar el portal CRM
        run: |
          node --check public/panel/config.js
          node --check public/panel/panel.js
          node --test tests/portal-crm.test.mjs
      - name: Validar nueva academia Guadalupe
        run: |
          node --check public/academia-guadalupe/aula.js
          node --check public/academia-guadalupe/catalog.js
          node --test tests/academy.test.mjs
      - name: Validar portal cinematográfico multipágina
        run: |
          node --check public/academia-guadalupe/portal-core.js
          node --check public/academia-guadalupe/portal-login.js
          node --check public/academia-guadalupe/portal-app.js
          node --test tests/academy-multipage.test.mjs
      - name: Verificar burbujas Fly Sales y WhatsApp
        run: node --test tests/contact-bubbles.test.mjs

      - name: Verificar estructura visual responsive
        run: node --test tests/visual-structure.test.mjs

      - name: Verificar experiencia pública de Guadalupe
        run: node --test tests/guadalupe-web-experience.test.mjs

      - name: Verificar identidad visual oficial Guadalupe
        run: node --test tests/guadalupe-brand.test.mjs

      - name: Compilar sitio como GitHub Pages
        run: GUADALUPE_GITHUB_PAGES=true npm run build

      - name: Adaptar enlaces literales para subruta
        run: node scripts/prepare-github-pages.mjs

      - name: Verificar enlaces y recursos de la exportación
        run: node --test tests/exported-site-integrity.test.mjs

      - name: Verificar hidratación de Andy y rutas de Next
        run: node --test tests/github-pages-hydration.test.mjs
